<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <title>评测工作流总览</title>
  <desc>五个已实现环节：病例与规则、多轮运行、质检、盲评与裁定、分析与改进；虚线框为设想：内部评测工具、判例库、回归测试。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1000" height="330" fill="#FFFFFF"/>

  <path d="M885 68 C885 22, 105 22, 105 68" fill="none" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="495" y="30" font-size="12" fill="#0F6E56" text-anchor="middle">发现的失败模式 → 写成规则、判例和测试用例 → 回到下一轮评测</text>

  <g font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="20" y="70" width="170" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="105" y="98" fill="#085041">病例与规则</text>
    <rect x="215" y="70" width="170" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="300" y="98" fill="#085041">多轮运行</text>
    <rect x="410" y="70" width="170" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="495" y="98" fill="#085041">质检</text>
    <rect x="605" y="70" width="170" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="690" y="98" fill="#085041">盲评与裁定</text>
    <rect x="800" y="70" width="170" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="885" y="98" fill="#085041">分析与改进</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#0F6E56">
    <text x="105" y="122">10 个病例 · 标注规范</text>
    <text x="300" y="122">模拟患者 · 60 段对话</text>
    <text x="495" y="122">规则报警 + 人工复核</text>
    <text x="690" y="122">双人盲评 · 一致性 · 裁定</text>
    <text x="885" y="122">统计 · AI 评委 · 报告</text>
  </g>
  <g stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)">
    <line x1="192" y1="105" x2="212" y2="105"/>
    <line x1="387" y1="105" x2="407" y2="105"/>
    <line x1="582" y1="105" x2="602" y2="105"/>
    <line x1="777" y1="105" x2="797" y2="105"/>
  </g>

  <g stroke="#BA7517" stroke-dasharray="5 4" fill="#FAEEDA">
    <rect x="20" y="190" width="560" height="60" rx="8"/>
    <rect x="605" y="190" width="170" height="60" rx="8"/>
    <rect x="800" y="190" width="170" height="60" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="300" y="214" font-size="15" font-weight="bold" fill="#633806">内部评测工具（第一期）</text>
    <text x="300" y="236" font-size="12" fill="#854F0B">任务配置快照 · 运行监控与断点续跑 · 结果追溯到原文和依据</text>
    <text x="690" y="214" font-size="15" font-weight="bold" fill="#633806">判例库</text>
    <text x="690" y="236" font-size="12" fill="#854F0B">安全边界的判定示例</text>
    <text x="885" y="214" font-size="15" font-weight="bold" fill="#633806">回归测试</text>
    <text x="885" y="236" font-size="12" fill="#854F0B">"先问再推荐"专项用例</text>
  </g>
  <g stroke="#B4B2A9" stroke-width="1" stroke-dasharray="2 3">
    <line x1="300" y1="142" x2="300" y2="188"/>
    <line x1="690" y1="142" x2="690" y2="188"/>
    <line x1="885" y1="142" x2="885" y2="188"/>
  </g>

  <rect x="300" y="285" width="18" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="326" y="297" font-size="12" fill="#444441">已实现（个人项目原型）</text>
  <rect x="520" y="285" width="18" height="14" rx="3" fill="#FAEEDA" stroke="#BA7517" stroke-dasharray="4 3"/>
  <text x="546" y="297" font-size="12" fill="#444441">设想（尚未实现）</text>
</svg>
