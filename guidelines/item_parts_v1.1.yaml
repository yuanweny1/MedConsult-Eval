# ============================================================
# 隐藏信息分部清单（标注规范 v1.1）
# 覆盖病例集 v1 的全部 48 条隐藏信息；正式评分前固定，评分员不临时决定。
#
# 拆分规则：拆分单位 = 问诊中可以单独提问、且不能由其他部分推知的一项事实。
#   同一项事实的时间、剂量、程度、数值等属性不单独拆分，随所属事实一并判定，
#   除非该部分的"最低获得标准"另有要求。
# 最低获得标准（min）：判"问出"所需获得的最少内容。
#   问题覆盖：“问出”要求医生的问题在语义上覆盖该部分，且患者随后提供了满足最低获得标准的信息。直接询问、明确的开放式询问均可；同一条目内未被问题覆盖而顺带披露的其他部分，记为“患者主动说出”。不要求逐字对应或逐部分单独提问。
#     例：“体重有没有下降”覆盖体重变化，不覆盖是否刻意减肥；“有没有其他症状”覆盖伴随症状，冷汗属于直接回答，但不因此覆盖吸烟、家族史等其他类别。“还有什么要补充吗”等没有明确范围的兜底问句，不视为覆盖任何具体部分。
#     问题中列举的例子不限制覆盖范围：问到同一类事实即算覆盖（如“有没有放射到背部或胸部”覆盖“是否放射”，患者答左肩左臂算问出）。
#     问“常用药、长期在吃的药”只覆盖吃不吃药、吃什么药，不覆盖服药是否规律。
#   末轮提问：最后一轮才提出、对话随即结束、患者没有机会回答的问题，记“未问出”，在说明中写“末轮提问”；“已问未答”只用于患者有机会回答却没有回答的情况（计入模拟患者质检）。
#   开场白排除：开场白中已披露的内容，即使模型随后重复询问，也不计为新获得；
#   若进一步问出开场白之外的隐藏细节（如开场说"闷"、后续问出"压迫感"），按最低获得标准计分。
#   "属性不要求"是本项目为覆盖率计分设置的最低标准，只用于覆盖率计分，
#   不代表剂量、时长、孕周、发病年龄等信息在医学上不重要。
#
# 计分：每个原始条目得分 = 通过提问获得的部分数 ÷ 该条目部分总数（患者主动说出、已问未答的部分不计分），
#       每个原始条目最高 1 分；再按原始条目计算覆盖率（不能直接用全部部分的问出比例）。
#       严格口径（敏感性分析）：全部部分都通过提问获得计 1，其余计 0。
#
# 状态：已确认（2026-10-16）
# ============================================================

status: 已确认
items:
