        url: "https://www.cancer.gov/about-cancer/causes-prevention/genetics/brca-fact-sheet"
        note: Reviewed 2024-07-19（审核日期）。VUS 重新分类前，应依据家族史和其他风险因素管理风险
      - name: 美国国家癌症研究所（NCI）Genetic Testing Fact Sheet
